name: selfhosted-cicd

services:
  gitea:
    image: gitea/gitea:1.22.3
    network_mode: host
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-3000}/
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__HTTP_PORT: ${GITEA_PORT:-3000}
      GITEA__server__DISABLE_SSH: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
    volumes:
      - gitea-data:/data

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v2.8.3
    network_mode: host
    restart: unless-stopped
    depends_on:
      - gitea
    environment:
      WOODPECKER_OPEN: "true"
      WOODPECKER_ADMIN: ${ADMIN_USER:-ci-admin}
      WOODPECKER_HOST: http://localhost:${WOODPECKER_PORT:-8000}
      WOODPECKER_SERVER_ADDR: ":${WOODPECKER_PORT:-8000}"
      WOODPECKER_GRPC_ADDR: ":${WOODPECKER_GRPC_PORT:-9000}"
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: http://localhost:${GITEA_PORT:-3000}
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT:-}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET:-}
      WOODPECKER_GITEA_SKIP_VERIFY: "true"
    volumes:
      - woodpecker-data:/var/lib/woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v2.8.3
    network_mode: host
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    environment:
      WOODPECKER_SERVER: localhost:${WOODPECKER_GRPC_PORT:-9000}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_HEALTHCHECK_ADDR: 127.0.0.1:3001
      WOODPECKER_BACKEND: docker
      WOODPECKER_BACKEND_DOCKER_API_VERSION: "1.44"
      WOODPECKER_BACKEND_DOCKER_NETWORK: host
      WOODPECKER_BACKEND_DOCKER_VOLUMES: /var/run/docker.sock:/var/run/docker.sock,trivy-cache:/root/.cache/trivy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  registry:
    image: registry:2.8.3
    network_mode: host
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 127.0.0.1:${REGISTRY_PORT:-5000}
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-}
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: cicd-registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/auth:/auth:ro

volumes:
  gitea-data:
  woodpecker-data:
  registry-data:
  trivy-cache:
